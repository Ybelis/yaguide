name: Publier YaGuiDe

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v6
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer le site statique
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v5
